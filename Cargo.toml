[package]
name = "mighty-crew"
version = "0.1.1"
edition = "2021"
description = "A crew of coding-agent sessions on one codebase: one role per working tree, a shared board, messages between roles."
license = "AGPL-3.0-only"
repository = "https://github.com/dreamference/mighty-crew"
default-run = "crew"

[[bin]]
name = "crew"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.8", features = ["preserve_order"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = { version = "1", features = ["preserve_order"] }
